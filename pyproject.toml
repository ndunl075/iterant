[project]
name = "iterant"
version = "0.0.0"
description = "Your agent improves itself: propose, sandbox-test and keep only statistically proven changes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iterant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "podman: needs rootless Podman",
    "docker: needs Docker (--unsafe-container backend)",
    "firecracker: needs Linux and /dev/kvm",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["iterant", "tests"]
exclude = ["**/.venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = ["iterant"]
