name: container-probe
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - run: podman --version && docker --version && podman info --format '{{.Host.Security.Rootless}} {{.Host.CgroupsVersion}}'
      - run: uv sync --locked
      - run: uv run pytest -q -rs -m "podman or docker"
